##################

- name: Check whether oh-my-zsh is already installed
  become: false
  ansible.builtin.stat:
    path: "{{ bootstrap_ohmyzsh_dir }}"
  register: bootstrap_ohmyzsh

- name: Remove incomplete oh-my-zsh directory if it exists
  become: false
  ansible.builtin.file:
    path: "{{ bootstrap_ohmyzsh_dir }}"
    state: absent
  when:
    - bootstrap_ohmyzsh.stat.exists
    - not bootstrap_ohmyzsh.stat.isdir or not bootstrap_ohmyzsh.stat.readable

- name: Clone oh-my-zsh repository
  become: false
  ansible.builtin.git:
    repo: "https://github.com/ohmyzsh/ohmyzsh.git"
    dest: "{{ bootstrap_ohmyzsh_dir }}"
    version: master
    single_branch: true
    update: false
  register: bootstrap_ohmyzsh_git

- name: Check whether default .zshrc exists
  become: false
  ansible.builtin.stat:
    path: "{{ bootstrap_ohmyzsh_home }}/.zshrc"
  register: bootstrap_zshrc_stat

- name: Install default .zshrc from template if missing
  become: false
  ansible.builtin.copy:
    src: "{{ bootstrap_ohmyzsh_dir }}/templates/zshrc.zsh-template"
    dest: "{{ bootstrap_ohmyzsh_home }}/.zshrc"
    remote_src: true
    force: false
    mode: "0644"
  when: not bootstrap_zshrc_stat.stat.exists

- name: Set zsh as default shell
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    shell: /bin/zsh

- name: Verify oh-my-zsh directory exists
  become: false
  ansible.builtin.stat:
    path: "{{ bootstrap_ohmyzsh_dir }}"
  register: bootstrap_ohmyzsh_dir_check

- name: Prints wether oh-my-zsh installation is valid
  ansible.builtin.assert:
    that:
      - bootstrap_ohmyzsh_dir_check.stat.exists
      - bootstrap_ohmyzsh_dir_check.stat.isdir
    fail_msg: "oh-my-zsh did not install correctly :/"
    success_msg: "oh-my-zsh is installed"
