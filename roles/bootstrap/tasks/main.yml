---
- name: Install packages
  ansible.builtin.apt:
    name:
      - openssh-server
      - sudo
      - zsh
      - vim
      - curl
      - wget
      - git
    state: present
    update_cache: true

- name: Start SSH service
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true

- name: Define oh-my-zsh paths
  ansible.builtin.set_fact:
    bootstrap_ohmyzsh_home: "{{ lookup('env', 'BOOTSTRAP_TARGET_USER') | default('dave') }}"
    bootstrap_ohmyzsh_dir: "{{ lookup('env', 'BOOTSTRAP_TARGET_USER') | default('dave') }}/.oh-my-zsh"

################## DEBUG TASK
# - name: Debug user paths
#   ansible.builtin.debug:
#     msg:
#       - "ansible_user={{ ansible_user | default('undefined') }}"
#       - "ansible_env.HOME={{ ansible_env.HOME | default('undefined') }}"
#       - "ansible_user_dir={{ ansible_user_dir | default('undefined') }}"
