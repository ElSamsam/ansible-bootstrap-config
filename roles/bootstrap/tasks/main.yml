---
- name: Install packages
  become: true
  ansible.builtin.apt:
    name:
      - openssh-server
      - sudo
      - zsh
      - vim
      - curl
      - wget
      - git
    state: present
    update_cache: true

- name: Start SSH service
  become: true
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true

- name: Check whether oh-my-zsh is already installed
  become: true
  become_user: "{{ bootstrap_zsh_user }}"
  ansible.builtin.stat:
    path: "{{ bootstrap_ohmyzsh_dir }}"
  register: bootstrap_ohmyzsh

- name: Clone oh-my-zsh
  become: true
  become_user: "{{ bootstrap_zsh_user }}"
  ansible.builtin.git:
    repo: "https://github.com/ohmyzsh/ohmyzsh.git"
    dest: "{{ bootstrap_ohmyzsh_dir }}"
    version: master
    update: false
  when: not bootstrap_ohmyzsh.stat.exists

- name: Check whether default .zshrc exists
  become: true
  become_user: "{{ bootstrap_zsh_user }}"
  ansible.builtin.stat:
    path: "{{ bootstrap_ohmyzsh_home }}/.zshrc"
  register: bootstrap_zshrc_stat

- name: Install default .zshrc from template if missing
  become: true
  become_user: "{{ bootstrap_zsh_user }}"
  ansible.builtin.copy:
    src: "{{ bootstrap_ohmyzsh_dir }}/templates/zshrc.zsh-template"
    dest: "{{ bootstrap_ohmyzsh_home }}/.zshrc"
    remote_src: true
    force: false
    mode: "0644"
  when: not bootstrap_zshrc_stat.stat.exists

- name: Set zsh as default shell
  become: true
  ansible.builtin.user:
    name: "{{ bootstrap_zsh_user }}"
    shell: /bin/zsh
