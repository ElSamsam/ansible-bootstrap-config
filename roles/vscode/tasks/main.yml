---
- name: Check if VS Code is already installed
  ansible.builtin.command: which code
  register: vscode_check
  changed_when: false
  failed_when: false

# Ansible key order: name -> when -> block -> always

- name: Install VS Code
  when: vscode_check.rc != 0 # checks if vs code is installed before doing anything
  block:
    - name: Download VS Code .deb
      ansible.builtin.get_url:
        url: "https://code.visualstudio.com/sha/download?build=stable&os=linux-deb-x64"
        dest: /tmp/vscode.deb
        mode: "0644"
        owner: root
        group: root

    - name: Install VS Code
      ansible.builtin.apt:
        deb: /tmp/vscode.deb
        state: present
  always:
    - name: Clean up temporary files
      ansible.builtin.file:
        path: /tmp/vscode.deb
        state: absent
